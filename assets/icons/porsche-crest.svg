<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E6B800" />
      <stop offset="100%" stop-color="#997300" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91424" />
      <stop offset="100%" stop-color="#8A000A" />
    </linearGradient>
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#crestShadow)">
    <!-- Outer Golden Shield -->
    <path d="M 100 12 C 160 12, 185 24, 188 50 C 190 120, 155 185, 100 228 C 45 185, 10 120, 12 50 C 15 24, 40 12, 100 12 Z" 
          fill="url(#goldGrad)" stroke="#111418" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Inner Border Line -->
    <path d="M 100 22 C 152 22, 175 32, 178 54 C 180 116, 148 174, 100 214 C 52 174, 20 116, 22 54 C 25 32, 48 22, 100 22 Z" 
          fill="none" stroke="#111418" stroke-width="2" />
    
    <!-- Top Header Banner for PORSCHE -->
    <path d="M 26 50 C 50 36, 150 36, 174 50 L 170 70 C 145 58, 55 58, 30 70 Z" fill="#111418" />
    <text x="100" y="64" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">PORSCHE</text>
    
    <!-- Quadrants: Top Left & Bottom Right (Antlers/Gold-Black), Top Right & Bottom Left (Red/Black Stripes) -->
    <!-- Quadrant Divider Lines -->
    <line x1="100" y1="70" x2="100" y2="214" stroke="#111418" stroke-width="3" />
    <line x1="22" y1="136" x2="178" y2="136" stroke="#111418" stroke-width="3" />
    
    <!-- Top-Right Quadrant: Red & Black Stripes -->
    <g clip-path="url(#topRightClip)">
      <rect x="100" y="70" width="78" height="66" fill="url(#redGrad)" />
      <path d="M 100 86 L 175 86 L 175 98 L 100 98 Z" fill="#111418" />
      <path d="M 100 114 L 176 114 L 176 126 L 100 126 Z" fill="#111418" />
    </g>
    
    <!-- Bottom-Left Quadrant: Red & Black Stripes -->
    <rect x="22" y="136" width="78" height="78" fill="url(#redGrad)" />
    <path d="M 22 152 L 100 152 L 100 164 L 22 164 Z" fill="#111418" />
    <path d="M 22 180 L 100 180 L 100 192 L 22 192 Z" fill="#111418" />
    
    <!-- Antler Stylized Bars in Top-Left and Bottom-Right -->
    <g fill="#111418">
      <!-- Top-left antlers -->
      <path d="M 38 84 Q 60 84 90 88 L 88 94 Q 60 90 38 90 Z" />
      <path d="M 34 100 Q 60 100 90 104 L 88 110 Q 60 106 34 106 Z" />
      <path d="M 32 116 Q 60 116 90 120 L 88 126 Q 60 122 32 122 Z" />
      
      <!-- Bottom-right antlers -->
      <path d="M 110 152 Q 140 152 165 158 L 163 164 Q 140 158 110 158 Z" />
      <path d="M 110 168 Q 138 168 158 174 L 156 180 Q 138 174 110 174 Z" />
      <path d="M 110 184 Q 135 184 148 190 L 146 196 Q 135 190 110 190 Z" />
    </g>
    
    <!-- Center Stuttgart Inner Shield -->
    <path d="M 100 100 C 122 100, 132 105, 133 115 C 134 144, 120 168, 100 178 C 80 168, 66 144, 67 115 C 68 105, 78 100, 100 100 Z" 
          fill="url(#goldGrad)" stroke="#111418" stroke-width="2.5" />
    
    <!-- STUTTGART Text -->
    <path d="M 74 114 C 84 111, 116 111, 126 114" stroke="#111418" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="100" y="113" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#111418" text-anchor="middle" letter-spacing="1.2">STUTTGART</text>
    
    <!-- Stuttgart Prancing Horse Silhouette in Center -->
    <path d="M 102 122 C 104 120, 108 121, 108 124 C 107 127, 104 128, 103 131 C 105 133, 109 130, 112 133 C 114 135, 112 139, 108 140 C 105 141, 106 145, 108 149 C 110 154, 111 161, 109 165 C 107 169, 103 170, 101 166 C 99 162, 101 156, 99 152 C 97 148, 93 147, 91 149 C 89 152, 90 159, 87 163 C 86 165, 84 163, 85 158 C 86 152, 88 147, 91 143 C 94 139, 93 136, 91 133 C 89 130, 93 129, 95 131 C 97 128, 95 125, 96 123 C 97 120, 100 120, 102 122 Z" 
          fill="#111418" />
  </g>
</svg>